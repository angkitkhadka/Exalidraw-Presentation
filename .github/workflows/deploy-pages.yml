name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deployments at once, cancel the older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build:app:static
        env:
          # GitHub Pages serves the app from https://<user>.github.io/<repo>/
          VITE_APP_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_HOSTNAME: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # this fork is fully local — no analytics, no collaboration backend
          VITE_APP_ENABLE_TRACKING: "false"
          # serve the fonts from the deployment instead of the upstream CDN
          VITE_APP_LOCAL_FONTS: "true"

      - name: Stamp the version
        run: yarn build:version

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: excalidraw-app/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
